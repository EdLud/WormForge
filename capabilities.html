<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WormForge verbs</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://github.com/EdLud/WormForge/blob/main/docs/verbs.md" />
  <script>
    // The capabilities matrix is retired: the verb list is docs/verbs.md now.
    // Old #verb=<key> links land on that verb's heading (GitHub's anchor:
    // lowercased, punctuation but _ and - dropped), a renamed one on its new
    // name; #cap=<id> on the top.
    (function () {
      var doc = 'https://github.com/EdLud/WormForge/blob/main/docs/verbs.md';
      var titled = {
        'claim': 'claim-fields',
        'fire-event': 'on_fire--on_click-events',
        'actor.fields': 'actor-fields',
        'object.fields': 'object-fields',
        'data.on_collect': 'dataauto_use'
      };
      var m = /^#verb=(.+)$/.exec(location.hash);
      var anchor = '';
      if (m) {
        var key = m[1];
        try { key = decodeURIComponent(key); } catch (e) {}
        anchor = titled[key] || key.toLowerCase().replace(/[^\w\- ]/g, '').replace(/ /g, '-');
      }
      location.replace(anchor ? doc + '#' + anchor : doc);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://github.com/EdLud/WormForge/blob/main/docs/verbs.md" /></noscript>
  <style>
    body { margin: 0; padding: 48px 16px; background: #eef1f4; color: #1a2330; font: 16px/1.5 system-ui, sans-serif; }
    a { color: #0b6e6a; }
    @media (prefers-color-scheme: dark) { body { background: #12171d; color: #dde4ec; } a { color: #6cc4bf; } }
  </style>
</head>
<body>
  <p>The capabilities page is retired. The Lua verb list is now
    <a href="https://github.com/EdLud/WormForge/blob/main/docs/verbs.md">docs/verbs.md</a>.</p>
</body>
</html>
