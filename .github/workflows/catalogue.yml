name: Catalogue validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r catalogue/requirements.txt
      - run: python catalogue/tools/test_catalogue.py
      - run: python tools/build-catalogue.py --check --site .
